<script>
(function(){

var K='a490efd3e1',CK='fw_app_html_v1';

function run(h){h=h.replace('<!--FW_HEAD-->',head).replace('/*FW_BOOT*/','window.FW_BOOT='+JSON.stringify({k:K,t:t,api:API})+';');document.open();document.write(h);document.close();}

})();
</script></body></html>
