<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FormWorks</title><meta name="theme-color" content="#1F2A44">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
// iPhone/iPad/Mac Safari save the CURRENT address (which carries the sign-in) only when there is no web-app
// manifest; with one they use its fixed start address and the saved app opens signed out. Others get the manifest.
var FW_SAFARI=/iphone|ipad|ipod/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&(navigator.maxTouchPoints>1||(/Safari\//.test(navigator.userAgent)&&!/Chrome|Chromium|Edg\//.test(navigator.userAgent))));
if(!FW_SAFARI){var l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l);}
</script>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FormWorks">
<style>html,body{margin:0;background:#0F1426}#fwload{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#B9BEDA;font:16px -apple-system,system-ui,sans-serif}</style>
</head><body><div id="fwload">Loading FormWorks…</div>
<script>
(function(){
var API='https://script.google.com/macros/s/AKfycbwiazqORh4fnxAF-gSGfbym4K6_8NheEwRERf5AwenBiuc6SnK9J2wCoW-mtT9CBRnY/exec';
var K='a490efd3e1',CK='fw_app_html_v1',done=false;
var t=new URLSearchParams(location.search).get('t')||'';
var head=(window.FW_SAFARI?'':'<link rel="manifest" href="manifest.json">')+'<link rel="apple-touch-icon" href="icon-180.png">';
function msg(s){var m=document.getElementById('fwload');if(m)m.textContent=s;}
// Swap in the app only after this loader page has fully loaded. Writing it in while the page was
// still being built (the saved-copy path) made Safari stack the app beside the loading text.
function run(h){
  if(done)return;done=true;
  h=h.replace('<!--FW_HEAD-->',head).replace('/*FW_BOOT*/','window.FW_BOOT='+JSON.stringify({k:K,t:t,api:API})+';');
  document.open();document.write(h);document.close();
}
function whenReady(fn){if(document.readyState==='complete')setTimeout(fn,0);else window.addEventListener('load',function(){setTimeout(fn,0)});}
var cached=null;try{cached=localStorage.getItem(CK)}catch(e){}
var fresh=fetch(API+'?src=app&k='+K,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(h){
  if(h.indexOf('/*FW_BOOT*/')<0)throw 0;try{localStorage.setItem(CK,h)}catch(e){}return h});
whenReady(function(){
  if(cached){run(cached);return;}
  fresh.then(run,function(){msg('Could not load FormWorks. Check your connection and refresh.')});
});
})();
</script></body></html>
